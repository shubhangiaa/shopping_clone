<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Shopping Cart</title>

    <!-- Bootstrap 4.6.2 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>

        body {
            background-color: rgb(232, 225, 225);
        }

        .login-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }

            .login-card .card-body {
                padding: 20px 15px;
            }

            .login-card h3 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container-fluid">

      <a class="navbar-brand text-white" href="./index.html">
       <img class="navbar-logo" src="https://img.icons8.com/bubbles/100/shopping-cart.png" alt="shopping-cart">
        Shopping Cart
      </a>

    <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbar"
    id="navbar-toggler"
  >
        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbar">

        <!-- Left side -->
        <ul class="navbar-nav">

          <li class="nav-item active">
            <a class="nav-link text-white active" href="./index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-white" href="./cart.html">
              Cart
            </a>
          </li>

        </ul>

        <!-- Right side -->
        <ul class="navbar-nav ml-auto ">

          <!-- NOT LOGGED IN -->
          <li class="nav-item" id="login-link">
            <a class="nav-link text-white" href="./login.html">
              Login
            </a>
          </li>

          <li class="nav-item" id="signup-link">
            <a class="nav-link text-white" href="./signup.html">
              Sign Up
            </a>
          </li>


          <!-- LOGGED IN -->
          <li class="nav-item">
            <span id="profile-name" class="nav-link text-white" style="display: none;">
              <i class="fas fa-user mr-2"></i>
            </span>
          </li>

          <li class="nav-item">
            <button type="button" id="signout-btn" class="btn btn-danger btn-sm ml-lg-2" style="display: none;"
              onclick="logout()">
              Sign Out
            </button>
          </li>

        </ul>

      </div>

    </div>

  </nav>

    <!-- Login -->
    <div class="container login-container">

        <div class="card shadow login-card">

            <div class="card-body">

                <h3 class="text-center mb-4">
                    Login
                </h3>

                <form id="login-form">

                    <div class="form-group">

                        <label for="login-email">
                            Email
                        </label>

                        <input type="email"
                            id="login-email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input type="password"
                            id="login-password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button type="submit"
                        class="btn btn-primary btn-block">

                        Login

                    </button>

                </form>


                <p class="text-center mt-3 mb-0">

                    Don't have an account?

                    <a href="./signup.html">
                        Sign Up
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- Popper -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Bootstrap 4.6.2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <!-- Authentication -->
    <script src="auth.js"></script>

    <!-- Login -->
    <script src="login.js"></script>

</body>

</html>
