<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container-fluid">

      <a class="navbar-brand text-white" href="./index.html">
       <img class="navbar-logo" src="https://img.icons8.com/bubbles/100/shopping-cart.png" alt="shopping-cart">
        Shopping Cart
      </a>

    <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbar"
    id="navbar-toggler"
  >
        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbar">

        <!-- Left side -->
        <ul class="navbar-nav">

          <li class="nav-item active">
            <a class="nav-link text-white active" href="./index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-white" href="./cart.html">
              Cart
            </a>
          </li>

        </ul>

        <!-- Right side -->
        <ul class="navbar-nav ml-auto ">

          <!-- NOT LOGGED IN -->
          <li class="nav-item" id="login-link">
            <a class="nav-link text-white" href="./login.html">
              Login
            </a>
          </li>

          <li class="nav-item" id="signup-link">
            <a class="nav-link text-white" href="./signup.html">
              Sign Up
            </a>
          </li>


          <!-- LOGGED IN -->
          <li class="nav-item">
            <span id="profile-name" class="nav-link text-white" style="display: none;">
              <i class="fas fa-user mr-2"></i>
            </span>
          </li>

          <li class="nav-item">
            <button type="button" id="signout-btn" class="btn btn-danger btn-sm ml-lg-2" style="display: none;"
              onclick="logout()">
              Sign Out
            </button>
          </li>

        </ul>

      </div>

    </div>

  </nav>
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card">

                    <div class="card-body">

                        <h3 class="text-center mb-4">
                            Create Account
                        </h3>

                        <form id="signup-form">

                            <div class="form-group">
                                <label>Name</label>
                                <input type="text"
                                    id="signup-name"
                                    class="form-control"
                                    required>
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email"
                                    id="signup-email"
                                    class="form-control"
                                    required>
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input type="password"
                                    id="signup-password"
                                    class="form-control"
                                    required>
                            </div>

                            <button type="submit"
                                class="btn btn-primary btn-block">
                                Sign Up
                            </button>

                        </form>

                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="login.html">Login</a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="signup.js"></script>

</body>
</html>
