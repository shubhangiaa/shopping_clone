<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <style>
      body {
         background-color: rgb(232, 225, 225);
      }

    </style>
</head>

<body>
    <!-- Navbar  -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container-fluid">

      <a class="navbar-brand text-white" href="./index.html">
        <img class="navbar-logo" src="https://img.icons8.com/bubbles/100/shopping-cart.png" alt="shopping-cart">
        Shopping Cart
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" id="navbar-toggler">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbar">

        <!-- Left side -->
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link text-white" href="./index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-white" href="./cart.html">
              Cart
            </a>
          </li>

        </ul>

        <!-- Right side -->
        <ul class="navbar-nav ml-auto align-items-lg-center">

          <!-- NOT LOGGED IN -->
          <li class="nav-item" id="login-link">
            <a class="nav-link text-white" href="./login.html">
              Login
            </a>
          </li>

          <li class="nav-item" id="signup-link">
            <a class="nav-link text-white" href="./signup.html">
              Sign Up
            </a>
          </li>


          <!-- LOGGED IN -->
          <li class="nav-item">
            <span id="profile-name" class="nav-link text-white" style="display: none;">
              <i class="fas fa-user mr-2"></i>
            </span>
          </li>

          <li class="nav-item">
            <button type="button" id="signout-btn" class="btn btn-danger btn-sm ml-lg-2" style="display: none;"
              onclick="logout()">
              Sign Out
            </button>
          </li>

        </ul>

      </div>

    </div>

  </nav>

    <div  class="container mt-4">
        <h2>Your Shopping Cart</h2>
        <ul class="list-group" id="cart-items"></ul>
        <h4>Total : <span id="cart-total">0.00</span></h4>
        <button class="btn btn-primary" id="buy-now-button">Buy Now</button>
    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./cart.js"></script>
<script src="auth.js"></script>
</body>

</html>
